name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Package plugin
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p release/logseq-journal-time-prefix
          cp -R dist release/logseq-journal-time-prefix/
          cp package.json README.md README.zh-CN.md LICENSE CHANGELOG.md icon.svg release/logseq-journal-time-prefix/
          cd release
          zip -r "logseq-journal-time-prefix-${VERSION}.zip" logseq-journal-time-prefix
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/logseq-journal-time-prefix-${{ github.ref_name }}.zip
